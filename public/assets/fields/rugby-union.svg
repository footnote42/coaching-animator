<svg width="2000" height="1400" viewBox="0 0 2000 1400" xmlns="http://www.w3.org/2000/svg">
  <!-- Pitch Background -->
  <rect width="2000" height="1400" fill="#1A3D1A" />
  
  <!-- Boundary Line (Touchlines & Dead Ball Lines) -->
  <rect x="50" y="50" width="1900" height="1300" fill="none" stroke="#F8F9FA" stroke-width="2" />
  
  <!-- Try Lines -->
  <line x1="200" y1="50" x2="200" y2="1350" stroke="#F8F9FA" stroke-width="3" />
  <line x1="1800" y1="50" x2="1800" y2="1350" stroke="#F8F9FA" stroke-width="3" />
  
  <!-- 22m Lines -->
  <line x1="440" y1="50" x2="440" y2="1350" stroke="#F8F9FA" stroke-width="2" />
  <line x1="1560" y1="50" x2="1560" y2="1350" stroke="#F8F9FA" stroke-width="2" />
  
  <!-- Halfway Line -->
  <line x1="1000" y1="50" x2="1000" y2="1350" stroke="#F8F9FA" stroke-width="2" />
  
  <!-- 10m Lines -->
  <line x1="800" y1="50" x2="800" y2="1350" stroke="#F8F9FA" stroke-width="2" stroke-dasharray="10 10" />
  <line x1="1200" y1="50" x2="1200" y2="1350" stroke="#F8F9FA" stroke-width="2" stroke-dasharray="10 10" />
  
  <!-- 5m Gang Lines -->
  <line x1="200" y1="130" x2="1800" y2="130" stroke="#F8F9FA" stroke-width="2" stroke-dasharray="10 10" />
  <line x1="200" y1="1270" x2="1800" y2="1270" stroke="#F8F9FA" stroke-width="2" stroke-dasharray="10 10" />

  <!-- Goal Posts (top-down view; H-shape on each try line) -->
  <!-- Left try line (x=200): uprights at y=650 and y=750, crossbar along x=200 -->
  <rect x="190" y="649" width="20" height="2" fill="#F8F9FA" />
  <rect x="190" y="749" width="20" height="2" fill="#F8F9FA" />
  <line x1="200" y1="650" x2="200" y2="750" stroke="#F8F9FA" stroke-width="3" />

  <!-- Right try line (x=1800) -->
  <rect x="1790" y="649" width="20" height="2" fill="#F8F9FA" />
  <rect x="1790" y="749" width="20" height="2" fill="#F8F9FA" />
  <line x1="1800" y1="650" x2="1800" y2="750" stroke="#F8F9FA" stroke-width="3" />
</svg>
