<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Circular seal in pitch-green -->
  <circle cx="50" cy="50" r="45" fill="#15803d" stroke="#d97706" stroke-width="4" />
  
  <!-- Outer dotted border -->
  <circle cx="50" cy="50" r="38" stroke="#d97706" stroke-width="2" stroke-dasharray="4 4" />
  
  <!-- "RFU" Text -->
  <text x="50" y="58" font-family="sans-serif" font-weight="bold" font-size="28" fill="#d97706" text-anchor="middle">RFU</text>
  
  <!-- "Endorsed" curved text (simplified with straight text for MVP if no path) -->
  <text x="50" y="25" font-family="sans-serif" font-weight="bold" font-size="10" fill="#f5f0e8" text-anchor="middle" letter-spacing="1">ENDORSED</text>
  <text x="50" y="82" font-family="sans-serif" font-weight="bold" font-size="10" fill="#f5f0e8" text-anchor="middle" letter-spacing="1">BY</text>
</svg>
